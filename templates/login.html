<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <img src="{{ url_for('static', filename='Gemini_Generated_Image_Paisagem.png.jpeg') }}" alt="Paisagem">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Entrar</button>

        </form>

        <p>
            <a href="{{ url_for('recuperar_senha') }}">Esqueci minha senha</a>
        </P>

        <p>
            Não possui uma conta?
            <a href="/cadastro">Cadastre-se</a>
        </p>

    </div>

</body>

</html>
