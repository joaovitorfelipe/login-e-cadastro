<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Conta</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='conta.css') }}">
</head>

<body>

    <header>

        <h2>Meu Sistema</h2>

        <a href="/logout">Sair</a>

    </header>


    <main>

        <section class="titulo">

            <a href="/configuracoes" class="voltar">← Voltar</a>
            <h1>Minha Conta</h1>

            <p>Gerencie suas informações pessoais.</p>

        </section>


        <section class="conta">

            <div class="conta-header">

                <h2>Informações pessoais</h2>

                <p>
                    Atualize o nome da sua conta.
                </p>

            </div>


            <div class="informacao">

                <span>Nome atual</span>

                <strong>{{ nome }}</strong>

            </div>


            <div class="informacao">

                <span>E-mail</span>

                <strong>{{ email }}</strong>

            </div>


            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="novo_nome">
                    Novo nome
                </label>

                <input
                    type="text"
                    id="novo_nome"
                    name="novo_nome"
                    placeholder="Digite seu novo nome"
                    required
                >


                {% if erro %}
                    <p class="erro">{{ erro }}</p>
                {% endif %}


                {% if sucesso %}
                    <p class="sucesso">{{ sucesso }}</p>
                {% endif %}


                <button type="submit">
                    Salvar alterações
                </button>

            </form>

        </section>

    </main>

</body>

</html>
